version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns: ["*"]
  # The signaling image's base and the e2e network suite's base images, pinned by tag and digest.
  # box.test.ts and image.test.ts hold node's major to .node-version and box.test.ts holds ubuntu's release
  # to the Lightsail blueprint, so those move only by hand; Dependabot still refreshes their digests. The
  # box and relay run privileged, and the signaling image runs in production, so a new version waits a week.
  - package-ecosystem: docker
    directories:
      - /apps/server
      - /apps/e2e/networks
      - /apps/e2e/networks/alb
      - /apps/e2e/networks/box
      - /apps/e2e/networks/coturn
      - /apps/e2e/networks/relay
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
      - dependency-name: ubuntu
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      docker:
        patterns: ["*"]
