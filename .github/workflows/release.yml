name: Release

on:
  push:
    branches: [production]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the commit is on main
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ $SHA =~ ^[0-9a-f]{40}$ ]] || { echo "::error::unexpected commit"; exit 1; }
          list=$(git rev-list --first-parent refs/remotes/origin/main) || list=
          if [ -z "$list" ]; then
            echo "::error::could not check $SHA against main"
            exit 1
          fi
          case "$list" in
          *"$SHA"*) ;;
          *)
            echo "::error::refused $SHA: not on main"
            exit 1
            ;;
          esac
      - name: Key the image inputs
        id: key
        env:
          IMAGE_INPUTS: apps/server packages/protocol package.json pnpm-lock.yaml pnpm-workspace.yaml
        run: |
          set -euo pipefail
          read -ra inputs <<<"$IMAGE_INPUTS"
          key=$(git rev-parse "${inputs[@]/#/HEAD:}" | sha256sum | cut -c1-64)
          [[ $key =~ ^[0-9a-f]{64}$ ]] || { echo "::error::could not key the image inputs"; exit 1; }
          echo "key=$key" >>"$GITHUB_OUTPUT"
      - name: Build the image
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Without attestations ECR stores one image manifest, which put-image can tag again.
          docker build -f apps/server/Dockerfile --build-arg REVISION="$SHA" --provenance=false --sbom=false -t fidant-signal:build .
          docker save fidant-signal:build -o "$RUNNER_TEMP/image.tar"
      # This repository's artifacts are public; the image holds only public code.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: ${{ runner.temp }}/image.tar
          retention-days: 1
          if-no-files-found: error

  # Holds AWS credentials, so it checks out nothing and runs only pinned actions, the aws CLI, docker and jq.
  release:
    needs: build
    runs-on: ubuntu-latest
    environment: app
    # Above the release step's three 30-minute waits, so the step reports its own timeout.
    timeout-minutes: 100
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: image
          path: ${{ runner.temp }}/image
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.FIDANT_POC_ACCOUNT }}:role/fidant-release
          aws-region: eu-north-1
          mask-aws-account-id: true
      - name: Push the image, move live and redeploy
        env:
          ACCOUNT: ${{ secrets.FIDANT_POC_ACCOUNT }}
          SHA: ${{ github.sha }}
          KEY: ${{ needs.build.outputs.key }}
        run: |
          set -euo pipefail
          [[ $SHA =~ ^[0-9a-f]{40}$ && $KEY =~ ^[0-9a-f]{64}$ && $ACCOUNT =~ ^[0-9]{12}$ ]] || { echo "::error::unexpected input"; exit 1; }
          repo=fidant-signal
          registry=$ACCOUNT.dkr.ecr.eu-north-1.amazonaws.com
          err=$RUNNER_TEMP/err
          image() { aws ecr batch-get-image --repository-name "$repo" --image-ids "$1" --output json; }
          digest() { image "$1" | jq -r '.images[0].imageId.imageDigest // "none"'; }
          tag() {
            json=$(image "$1")
            manifest=$(jq -er '.images[0].imageManifest' <<<"$json")
            type=$(jq -er '.images[0].imageManifestMediaType' <<<"$json")
            aws ecr put-image --repository-name "$repo" --image-tag "$2" --image-manifest "$manifest" \
              --image-manifest-media-type "$type" >/dev/null 2>"$err" ||
              grep -q '(ImageAlreadyExistsException)' "$err" || { cat "$err" >&2; exit 1; }
          }
          services() { aws ecs describe-services --cluster fidant --services fidant-signal --output json; }
          # One deployment, COMPLETED, so no deployment starts while the service rolls back.
          settled() {
            for _ in $(seq 120); do
              json=$(services)
              s=$(jq -r '[(.services[0].deployments | length), .services[0].deployments[0].rolloutState] | @tsv' <<<"$json")
              if [ "$s" = $'1\tCOMPLETED' ]; then return 0; fi
              sleep 15
            done
            echo "::error::the service did not settle within 30 minutes: $s"
            exit 1
          }

          d=$(digest "imageTag=inputs-$KEY")
          if [ "$d" = none ]; then
            s=$(digest "imageTag=$SHA")
            if [ "$s" = none ]; then
              docker load -i "$RUNNER_TEMP/image/image.tar" >/dev/null
              aws ecr get-login-password --region eu-north-1 | docker login --username AWS --password-stdin "$registry" >/dev/null
              docker tag fidant-signal:build "$registry/$repo:$SHA"
              docker push --quiet "$registry/$repo:$SHA" >/dev/null
            fi
            tag "imageTag=$SHA" "inputs-$KEY"
            d=$(digest "imageTag=inputs-$KEY")
          fi
          previous=$(digest imageTag=live)
          if [ "$previous" = "$d" ]; then
            echo "live already names $d"
            exit 0
          fi

          if json=$(services 2>"$err"); then
            state=$(jq -r '[.services[0].status // "None", .failures[0].reason // "None"] | @tsv' <<<"$json")
          elif grep -q '(ClusterNotFoundException)' "$err"; then
            state=$'None\tMISSING'
          else
            cat "$err" >&2
            exit 1
          fi
          case "$state" in
          $'None\tMISSING')
            tag "imageDigest=$d" live
            echo "No signaling service yet; live names $d"
            exit 0
            ;;
          $'ACTIVE\tNone') ;;
          *)
            echo "::error::unexpected service state: $state"
            exit 1
            ;;
          esac
          if [ "$previous" = none ]; then
            echo "::error::the service runs, but live names no image"
            exit 1
          fi

          settled
          tag "imageDigest=$d" live
          if ! json=$(aws ecs update-service --cluster fidant --service fidant-signal --force-new-deployment --output json); then
            tag "imageDigest=$previous" live
            echo "::error::could not start a deployment; live names $previous again"
            exit 1
          fi
          dep=$(jq -r '[.service.deployments[] | select(.status == "PRIMARY") | .id][0] // "None"' <<<"$json")
          [[ $dep =~ ^ecs-svc/[0-9]+$ ]] || { echo "::error::unexpected deployment: $dep"; exit 1; }
          for _ in $(seq 120); do
            json=$(services)
            s=$(jq -r --arg id "$dep" '[([.services[0].deployments[] | select(.id == $id) | .rolloutState][0] // "None"), (.services[0].deployments | length)] | @tsv' <<<"$json")
            case "$s" in
            $'COMPLETED\t1')
              echo "live names $d, and the service runs it"
              exit 0
              ;;
            FAILED* | None*)
              settled
              tag "imageDigest=$previous" live
              echo "::error::the new task failed its health check; the service went back to $previous and live names it again"
              exit 1
              ;;
            esac
            sleep 15
          done
          echo "::error::the deployment did not finish within 30 minutes: $s; live names $d"
          exit 1
