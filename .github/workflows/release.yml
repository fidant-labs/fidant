name: Release

on:
  push:
    branches: [production]

permissions: {}

# Shared with deploy-infra.yml: their runs go one at a time. What this does not order: 0023.
concurrency:
  group: fidant-deploy
  cancel-in-progress: false
  queue: max

jobs:
  release:
    permissions:
      contents: read
      id-token: write
    # By its full path at main, never ./: fidant-release trusts only release-jobs.yml on main.
    uses: fidant-labs/fidant/.github/workflows/release-jobs.yml@main
    secrets:
      FIDANT_POC_ACCOUNT: ${{ secrets.FIDANT_POC_ACCOUNT }}
