name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A pull request's new push cancels its older run. Each push to main gets its own group,
  # so no run cancels or replaces it: each scans only its own range for secrets.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Scans the pushed commits for secrets, which the pre-commit hook misses when it was skipped
      # or never installed. It runs after the push, so the secret is already public: a hit means
      # rotate it now, then remove it. A pinned release, checked against its hash.
      # gitleaks scans 0 commits and passes when the base is missing, so a missing base fails.
      # The pushed commits must not configure their own scan, so .gitleaks.toml and .gitleaksignore
      # are deleted from this checkout first, and --text keeps .gitattributes from hiding a file as binary.
      # --remerge-diff also scans what a merge commit added.
      - name: Scan pushed commits for secrets
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          curl -fsSLo "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          git rev-parse --verify --quiet "$BASE^{commit}" >/dev/null || { echo "::error::Scan base $BASE not found"; exit 1; }
          rm -f .gitleaks.toml .gitleaksignore
          "$RUNNER_TEMP/gitleaks" git --log-opts="--text --remerge-diff $BASE..HEAD" --redact --no-banner ||
            { echo "::error::Secret in the pushed commits. It is public now: rotate it first, then remove it."; exit 1; }
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  # Uses the Chrome preinstalled on the runner. Reports stay on the runner and are
  # never uploaded: this repository's artifacts are public.
  lighthouse:
    # Disabled until single-run scores stop failing at random (FID-135).
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lighthouse

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: pw
        run: echo "version=$(pnpm --filter @fidant/e2e exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @fidant/e2e exec playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @fidant/e2e exec playwright install-deps chromium
      # The stack runs its own coturn on a free port, so the system service the package starts does not get in the way.
      - run: sudo apt-get update && sudo apt-get install -y coturn
      # Mailpit catches the server's mail. It is not in apt: a pinned release, checked against its hash.
      - run: |
          curl -fsSLo "$RUNNER_TEMP/mailpit.tar.gz" https://github.com/axllent/mailpit/releases/download/v1.33.1/mailpit-linux-amd64.tar.gz
          echo "84d7fe375ebef25df26758984dc0d5d5e17d8c0734cb2e77be7873b14ab51716  $RUNNER_TEMP/mailpit.tar.gz" | sha256sum -c -
          sudo tar -xzf "$RUNNER_TEMP/mailpit.tar.gz" -C /usr/local/bin mailpit
      - run: pnpm e2e
      # Only the observations (recorded traffic, and run/ with the server and coturn logs) are uploaded.
      # Traces, screenshots and the HTML report can contain full link URLs with key fragments,
      # so they stay local: this repository's artifacts are public.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-observations
          path: apps/e2e/observations
          retention-days: 7

  # Browsers, coturn and the server run in Docker (apps/e2e/networks), so nothing is installed on the host.
  e2e-networks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The lossy row shapes the link with tc netem, which works in the router container only
      # when the host kernel has the module loaded.
      - run: sudo modprobe sch_netem
      # Building the images from scratch took 274s of the job's setup (FID-365). The layers go to
      # GitHub Actions' cache through compose.gha-cache.yaml, which needs the cache service's
      # address and token; only JavaScript actions get them, so this step hands them on. A pull
      # request's cache writes stay in its own scope, and it reads main's.
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            for (const name of ["ACTIONS_CACHE_URL", "ACTIONS_CACHE_SERVICE_V2", "ACTIONS_RESULTS_URL", "ACTIONS_RUNTIME_TOKEN"]) {
              if (process.env[name]) core.exportVariable(name, process.env[name]);
            }
            core.exportVariable("FIDANT_E2E_GHA_CACHE", "1");
      - run: pnpm e2e:networks
      # Same rule as the e2e job: only the observations are uploaded. The coturn capture holds
      # STUN/TURN headers and DTLS ciphertext, never file content or keys.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-networks-observations
          path: apps/e2e/observations
          retention-days: 7
