name: Nightly

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/nightly.yml

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One engine per job: the suite runs one engine per invocation (apps/e2e/README.md).
  e2e:
    name: e2e (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            large: "1"
            minutes: 45
          - browser: firefox
            minutes: 30
          - browser: webkit
            minutes: 30
    env:
      SIGILL_E2E_BROWSER: ${{ matrix.browser }}
      SIGILL_E2E_LARGE: ${{ matrix.large }}
      # Outside /home/runner, so the test user needs no access to the runner's home for the browsers.
      PLAYWRIGHT_BROWSERS_PATH: /opt/ms-playwright
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # No cache: Playwright's WebKit build differs per Ubuntu release, which a cache key on runner.os misses.
      - run: |
          sudo install -d -o "$(id -u)" -g "$(id -g)" "$PLAYWRIGHT_BROWSERS_PATH"
          pnpm --filter @sigill/e2e exec playwright install --with-deps "$SIGILL_E2E_BROWSER"
      # The package starts a coturn that relays for anyone as its own user, past the block; the stack runs its own.
      - run: sudo apt-get update && sudo apt-get install -y coturn && sudo systemctl disable --now coturn
      # Mailpit catches the server's mail. It is not in apt: a pinned release, checked against its hash.
      - run: |
          curl -fsSLo "$RUNNER_TEMP/mailpit.tar.gz" https://github.com/axllent/mailpit/releases/download/v1.33.1/mailpit-linux-amd64.tar.gz
          echo "84d7fe375ebef25df26758984dc0d5d5e17d8c0734cb2e77be7873b14ab51716  $RUNNER_TEMP/mailpit.tar.gz" | sha256sum -c -
          sudo tar -xzf "$RUNNER_TEMP/mailpit.tar.gz" -C /usr/local/bin mailpit
      - run: pnpm run build
      - name: Show disk and memory
        run: |
          df -h
          free -m
          if [ "$SIGILL_E2E_LARGE" = 1 ]; then
            df -B1 --output=avail /tmp | awk 'NR == 2 && $1 < 8e9 { print "::error::/tmp has " $1 " bytes free; the large files need 8 GB"; exit 1 }'
          fi
      - name: Create the test user
        run: |
          sudo useradd --create-home sigill-e2e
          dir=$GITHUB_WORKSPACE
          until [ "$dir" = / ]; do
            sudo chmod o+x "$dir"
            dir=$(dirname "$dir")
          done
          # Global setup replaces observations/, and Playwright writes test-results/ and playwright-report/ next to it.
          sudo chgrp sigill-e2e apps/e2e
          sudo chmod g+w apps/e2e
          namei -l "$GITHUB_WORKSPACE/apps/e2e" "$PLAYWRIGHT_BROWSERS_PATH" "$(command -v node)"
      # Some runner images leave this machine's own name out of /etc/hosts, so a lookup of it would reach the resolver.
      - name: Map this machine's own name in /etc/hosts
        run: |
          mapfile -t names < <(printf '%s\n' "$(hostname -f 2>/dev/null || true)" "$(hostname -s)" | grep . | sort -u)
          for name in "${names[@]}"; do
            getent -s files hosts "$name" >/dev/null || echo "127.0.1.1 $name" | sudo tee -a /etc/hosts
          done
          getent -s files hosts "${names[@]}"
      - name: Let the test user reach loopback only
        id: egress
        run: |
          for ipt in iptables ip6tables; do
            for chain in sigill-egress sigill-dns; do
              sudo "$ipt" -N "$chain"
              sudo "$ipt" -A "$chain" -j LOG --log-uid --log-prefix "$chain: "
              sudo "$ipt" -A "$chain" -j REJECT
            done
            # The 127.0.0.53 stub forwards lookups as another user, so they are refused before loopback is allowed.
            sudo "$ipt" -I OUTPUT 1 -m owner --uid-owner sigill-e2e -o lo -p udp --dport 53 -j sigill-dns
            sudo "$ipt" -I OUTPUT 2 -m owner --uid-owner sigill-e2e -o lo -p tcp --dport 53 -j sigill-dns
            # Linux sends traffic to this machine's own addresses through lo, so ICE host candidates stay allowed.
            sudo "$ipt" -I OUTPUT 3 -m owner --uid-owner sigill-e2e -o lo -j ACCEPT
            sudo "$ipt" -I OUTPUT 4 -m owner --uid-owner sigill-e2e -j sigill-egress
            sudo "$ipt" -S OUTPUT
          done
          grep -v '^#' /etc/resolv.conf
          grep '^hosts:' /etc/nsswitch.conf
          sudo ss -tulpn
          logged() {
            for ipt in iptables ip6tables; do
              for chain in sigill-egress sigill-dns; do sudo "$ipt" -nvxL "$chain"; done
            done | awk '$3 == "LOG" { n += $1 } END { print n + 0 }'
          }
          blocked() {
            local before
            before=$(logged)
            if sudo -u sigill-e2e "$@"; then
              echo "::error::The test user ran $* past the block"
              exit 1
            fi
            [ "$(logged)" -gt "$before" ] || { echo "::error::The block did not log $*"; exit 1; }
          }
          blocked curl -sS --max-time 5 http://1.1.1.1/
          blocked getent hosts example.com
          blocked curl -sS -g --max-time 5 'http://[::1]:53/'
          for ipt in iptables ip6tables; do
            for chain in sigill-egress sigill-dns; do sudo "$ipt" -Z "$chain"; done
          done
          # journalctl --since counts whole seconds, so this keeps the checks' own lines out of the log printed after the tests.
          sleep 1
          echo "EGRESS_SINCE=$(date +%s)" >> "$GITHUB_ENV"
      # Not through pnpm, whose update check would reach the registry; --project fails the run if the variable were ever ignored.
      - name: Run the suite as the test user
        working-directory: apps/e2e
        run: |
          sudo -u sigill-e2e env -i PATH="$PATH" HOME=/home/sigill-e2e LANG="$LANG" CI=true \
            PLAYWRIGHT_BROWSERS_PATH="$PLAYWRIGHT_BROWSERS_PATH" \
            SIGILL_E2E_BROWSER="$SIGILL_E2E_BROWSER" SIGILL_E2E_LARGE="$SIGILL_E2E_LARGE" \
            "$PWD/node_modules/.bin/playwright" test --project="$SIGILL_E2E_BROWSER"
      - name: Count what the test user sent off loopback
        if: always() && steps.egress.outcome == 'success'
        run: |
          for ipt in iptables ip6tables; do
            sudo "$ipt" -nvxL OUTPUT
            sudo "$ipt" -nvxL sigill-egress
            sudo "$ipt" -nvxL sigill-dns
          done
          sudo journalctl -k -q --no-pager --since "@$EGRESS_SINCE" | grep -E 'sigill-(egress|dns): ' || true
          count() {
            for ipt in iptables ip6tables; do sudo "$ipt" -nvxL "$1"; done |
              awk '$3 == "LOG" { n += $1 } END { print n + 0 }'
          }
          sent=$(count sigill-egress)
          looked=$(count sigill-dns)
          [ "$sent" -eq 0 ] || { echo "::error::The test user sent $sent packets off loopback; the sigill-egress lines above name each"; exit 1; }
          [ "$looked" -eq 0 ] && exit 0
          # WebKit looks up the other peer's mDNS candidate names (a UUID and .local) through DNS when the machine has no mDNS.
          if [ "$SIGILL_E2E_BROWSER" = webkit ]; then
            echo "::warning::WebKit sent $looked name lookups to the resolver, all refused"
          else
            echo "::error::The test user sent $looked packets to the resolver; the sigill-dns lines above name each"
            exit 1
          fi
      # The test user opens what it wrote to the upload, which runs as runner; root would follow a symlink it planted.
      - if: failure() || cancelled()
        run: "[ ! -d apps/e2e/observations ] || sudo -u sigill-e2e chmod -R a+rX apps/e2e/observations"
      # Same rule as ci.yml's e2e job: only the observations are uploaded, never traces or reports.
      - if: failure() || cancelled()
        run: '[ ! -e apps/e2e/observations ] || { [ ! -L apps/e2e/observations ] && [ -z "$(find apps/e2e/observations -type l)" ]; } || { echo "::error::apps/e2e/observations holds a symlink, so it is not uploaded"; exit 1; }'
      - if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-observations-${{ matrix.browser }}
          path: apps/e2e/observations
          retention-days: 7

  # One open issue collects every failed night; a leg past its timeout can end cancelled, not failed.
  report:
    needs: e2e
    if: always() && github.event_name != 'pull_request' && (needs.e2e.result == 'failure' || needs.e2e.result == 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Comment on the open "Nightly failed" issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          body="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID on $GITHUB_REF_NAME"
          # Anyone can open an issue with this title, so only one the Actions bot opened counts.
          issue=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" \
            --jq '.[] | select(.pull_request == null and .title == "Nightly failed" and .user.login == "github-actions[bot]") | .number' | sed -n 1p)
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$body"
          else
            gh issue create --title "Nightly failed" --body "$body"
          fi
