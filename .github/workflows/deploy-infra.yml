name: Deploy infra

on:
  push:
    branches: [main]
    paths:
      - apps/infra/**
      - pnpm-lock.yaml
      - .node-version
      - .github/workflows/deploy-infra.yml

permissions: {}

concurrency:
  group: deploy-infra
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy ${{ matrix.stack }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - stack: FidantDns
            account: FIDANT_DNS_ACCOUNT
          - stack: FidantSite
            account: FIDANT_POC_ACCOUNT
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sigill/infra test
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets[matrix.account] }}:role/fidant-ci-deploy
          aws-region: eu-north-1
      - run: pnpm --filter @sigill/infra cdk deploy ${{ matrix.stack }} --require-approval never
        env:
          FIDANT_DNS_ACCOUNT: ${{ secrets.FIDANT_DNS_ACCOUNT }}
          FIDANT_POC_ACCOUNT: ${{ secrets.FIDANT_POC_ACCOUNT }}
