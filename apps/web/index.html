<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <!-- Same text as footer.tagline in src/i18n/en.ts. The build replaces it in each page copy (src/i18n/preview.ts). -->
    <meta name="description" content="Files encrypted in your browser, readable only by the recipient unless you ask us to email the link." />
    <title>Fidant</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <noscript>
      <main lang="en" class="mx-auto grid max-w-2xl gap-4 px-6 py-10">
        <h1 class="m-0 text-3xl font-semibold">Send a file only the recipient can open.</h1>
        <p class="m-0">Fidant encrypts the file in your browser before it goes to the person you choose. It is never stored, and unless you ask us to email the link, nobody in between, us included, can read it.</p>
        <h2 class="m-0 text-xl font-semibold">What happens</h2>
        <ol class="m-0 grid list-decimal gap-2 pl-6">
          <li>Choose a file. It stays on your computer. Nothing is uploaded.</li>
          <li>Add who it's for. Each person gets their own link, which works once.</li>
          <li>Share the link. When they open it, the file goes from your browser to theirs, encrypted the whole way.</li>
        </ol>
        <p class="m-0">The encryption runs in your browser, so Fidant needs JavaScript. Turn it on to send or receive a file.</p>
        <nav class="flex flex-wrap gap-4 underline">
          <a href="/about">About</a>
          <a href="/security">Security</a>
          <a href="/privacy">Privacy</a>
          <a href="/terms">Terms</a>
          <a href="https://github.com/sigill-labs/sigill">Source code</a>
        </nav>
      </main>
    </noscript>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
