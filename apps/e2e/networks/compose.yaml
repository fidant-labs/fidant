# Simulated networks for the network scenarios in the e2e suite.
#
#   site-a 10.89.1.0/24: router-a (.2), net-a1 (.11), net-a2 (.12)
#   site-b 10.89.2.0/24: router-b (.2), net-b1 (.11)
#   public 198.51.100.0/24 (TEST-NET-2): router-a (.2), router-b (.3), coturn (.20), box (.30),
#     relay (.40), alb (.50), pages (.60)
#   lb 10.89.3.0/24, internal: alb (.2), signal (.10)
#
# Each browser-xx shares the network namespace of net-xx, whose default route is its site's
# router. The routers NAT onto public, which has no way out, so nothing reaches the internet.
#
# Environment: PLAYWRIGHT_VERSION, FIDANT_E2E_REPO (repo path on the host),
# FIDANT_E2E_RUN_DIR (observations/run), FIDANT_E2E_COTURN_DIR (holds turnserver.conf and the TLS certificate,
# and signal.env and signal-relays.json for signal),
# FIDANT_E2E_BOX_DIR (the box's config files at their paths under /),
# FIDANT_E2E_RELAY_DIR (the relay's install.sh inputs in env, and its TLS pair in tls/),
# FIDANT_E2E_PAGES_DIR (the web build made with SIGNALS_FILE, as the release uploads it),
# FIDANT_E2E_UID and FIDANT_E2E_GID (the host user, so files in the run dir stay theirs).
name: fidant-e2e

networks:
  public:
    name: fidant-e2e-public
    internal: true
    ipam:
      config:
        - subnet: 198.51.100.0/24
  # The site networks are not internal: published ports need that, and with br_netfilter an
  # internal network drops frames to addresses outside its subnet, such as browser -> router.
  # The site's own default route points at its router instead.
  site-a:
    ipam:
      config:
        - subnet: 10.89.1.0/24
  site-b:
    ipam:
      config:
        - subnet: 10.89.2.0/24
  lb:
    name: fidant-e2e-lb
    internal: true
    ipam:
      config:
        - subnet: 10.89.3.0/24

x-tools: &tools
  image: fidant-e2e-net
  build: .
  cap_add: [NET_ADMIN]
  init: true

x-router: &router
  <<: *tools
  sysctls:
    net.ipv4.ip_forward: 1
  volumes:
    - ./router.sh:/net/router.sh:ro
  command: ["sh", "-c", "/net/router.sh init && /net/router.sh cone && exec sleep infinity"]
  healthcheck:
    test: ["CMD-SHELL", "iptables -t nat -S POSTROUTING | grep -q MASQUERADE"]
    interval: 1s
    retries: 30

# Holds a site address and the network namespace its browser joins.
x-host: &host
  <<: *tools
  command: ["sh", "-c", "ip route replace default via $$ROUTER && exec sleep infinity"]
  healthcheck:
    test: ["CMD-SHELL", 'ip route | grep -q "^default via $$ROUTER "']
    interval: 1s
    retries: 30

x-browser: &browser
  # Tag only, no digest: the tag must follow @playwright/test in the lockfile, which Dependabot's npm
  # group bumps, so a digest here would go stale on every bump. Microsoft's registry (MCR) serves it.
  image: mcr.microsoft.com/playwright:v${PLAYWRIGHT_VERSION:?}-noble
  init: true
  shm_size: 1gb
  volumes:
    - ${FIDANT_E2E_REPO:?}:${FIDANT_E2E_REPO:?}:ro
  working_dir: ${FIDANT_E2E_REPO:?}
  # --unsafe keeps the launch args the tests send, such as --host-resolver-rules.
  command:
    - node
    - apps/e2e/node_modules/@playwright/test/cli.js
    - run-server
    - --port=3000
    - --host=0.0.0.0
    - --unsafe
  healthcheck:
    test:
      - CMD
      - node
      - -e
      - "require('net').connect(3000, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"
    interval: 1s
    retries: 60

services:
  router-a:
    <<: *router
    networks:
      site-a: { ipv4_address: 10.89.1.2 }
      public: { ipv4_address: 198.51.100.2 }
  router-b:
    <<: *router
    networks:
      site-b: { ipv4_address: 10.89.2.2 }
      public: { ipv4_address: 198.51.100.3 }

  # ponytail: fixed host ports; read them with `docker compose port` if they ever collide.
  net-a1:
    <<: *host
    environment: { ROUTER: 10.89.1.2 }
    networks:
      site-a: { ipv4_address: 10.89.1.11 }
    ports: ["127.0.0.1:39011:3000"]
  net-a2:
    <<: *host
    environment: { ROUTER: 10.89.1.2 }
    networks:
      site-a: { ipv4_address: 10.89.1.12 }
    ports: ["127.0.0.1:39012:3000"]
  net-b1:
    <<: *host
    environment: { ROUTER: 10.89.2.2 }
    networks:
      site-b: { ipv4_address: 10.89.2.11 }
    ports: ["127.0.0.1:39021:3000"]

  browser-a1:
    <<: *browser
    network_mode: service:net-a1
  browser-a2:
    <<: *browser
    network_mode: service:net-a2
  browser-b1:
    <<: *browser
    network_mode: service:net-b1

  coturn:
    image: fidant-e2e-coturn
    build: coturn
    user: ${FIDANT_E2E_UID:?}:${FIDANT_E2E_GID:?}
    # Replaces the image's default command, which looks up the external IP on the internet.
    command: ["-c", "/etc/fidant/turnserver.conf"]
    # TURN over TLS on 443 without root. Namespaced, so the host keeps its own setting.
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    volumes:
      - ${FIDANT_E2E_COTURN_DIR:?}:/etc/fidant:ro
      # At its host path, so the log-file path in turnserver.conf is the same on both sides.
      - ${FIDANT_E2E_RUN_DIR:?}:${FIDANT_E2E_RUN_DIR:?}
    networks:
      public: { ipv4_address: 198.51.100.20 }

  # Every packet to and from coturn, for the leak scan: observations/run/coturn.pcap. It runs as
  # root in coturn's network namespace with NET_RAW, so the host needs no sudo. The file is made
  # first and given to the host user; tcpdump keeps that owner when it truncates the file.
  # -U writes each packet as it arrives, so a test can scan its packets right after it ends.
  pcap:
    <<: *tools
    cap_add: [NET_RAW, NET_ADMIN]
    network_mode: service:coturn
    environment:
      PCAP: ${FIDANT_E2E_RUN_DIR:?}/coturn.pcap
      OWNER: ${FIDANT_E2E_UID:?}:${FIDANT_E2E_GID:?}
    volumes:
      - ${FIDANT_E2E_RUN_DIR:?}:${FIDANT_E2E_RUN_DIR:?}
    command:
      - sh
      - -c
      - 'touch "$$PCAP" && chown "$$OWNER" "$$PCAP" && exec tcpdump -i any -U -Z root -w "$$PCAP"'
    healthcheck:
      # tcpdump opens the file once it is capturing. The file stays empty until the first packet.
      test: ["CMD-SHELL", 'ls -l /proc/*/fd 2>/dev/null | grep -q " -> $$PCAP$$"']
      interval: 1s
      retries: 30

  # The POC box: systemd with the app server, HAProxy, Caddy, coturn and rsyslog, configured from the
  # rendered user data (box/Dockerfile). The browsers reach it as fidant.se and turn.fidant.se.
  box:
    image: fidant-e2e-box
    build: box
    privileged: true
    tmpfs: [/run, /run/lock]
    volumes:
      # fidant.service's WorkingDirectory, as the release symlink is on the box.
      - ${FIDANT_E2E_REPO:?}:/opt/fidant/current:ro
      - ${FIDANT_E2E_BOX_DIR:?}:/box:ro
    networks:
      public: { ipv4_address: 198.51.100.30 }
    healthcheck:
      # The server's check is fidant-deploy's: fidant.service is briefly active even when it
      # exits at once and restarts.
      test:
        - CMD-SHELL
        - for u in fidant haproxy caddy coturn rsyslog; do systemctl is-active --quiet $$u || exit 1; done && curl -fsk --max-time 2 -o /dev/null https://127.0.0.1:8443/
      interval: 1s
      retries: 90

  # The relay box: a new Ubuntu server that runs apps/infra/relay/install.sh at boot (relay/Dockerfile).
  relay:
    image: fidant-e2e-relay
    build: relay
    privileged: true
    tmpfs: [/run, /run/lock]
    volumes:
      - ${FIDANT_E2E_REPO:?}/apps/infra/relay/install.sh:/relay/install.sh:ro
      - ${FIDANT_E2E_RELAY_DIR:?}:/relay-config:ro
    networks:
      public: { ipv4_address: 198.51.100.40 }
    healthcheck:
      test:
        - CMD-SHELL
        - systemctl is-active --quiet relay-install && systemctl is-active --quiet coturn
      interval: 1s
      retries: 90

  signal:
    image: fidant-e2e-signal
    build:
      context: ${FIDANT_E2E_REPO:?}
      dockerfile: apps/server/Dockerfile
    read_only: true
    # Docker Desktop makes a bare tmpfs root's, and the server then can't write to it.
    tmpfs: ["/run/fidant:uid=1000,gid=1000,mode=700"]
    # No healthcheck: its exec would inherit RELAY_MASTER, which this file holds.
    env_file: ${FIDANT_E2E_COTURN_DIR:?}/signal.env
    environment:
      SIGNALING_ONLY: "1"
      PUBLIC_ORIGIN: https://fidant.se
      TRUSTED_PROXIES: 10.89.3.0/24
      RELAYS_FILE: /config/relays.json
      RELAY_MASTER_FILE: /run/fidant/relay-master
      CERT_DIR: /run/fidant/certs
      STUN_URLS: stun:198.51.100.20:3478
      HTTP_KEEP_ALIVE_MS: "125000"
    volumes:
      - ${FIDANT_E2E_COTURN_DIR:?}/signal-relays.json:/config/relays.json:ro
    networks:
      lb: { ipv4_address: 10.89.3.10 }

  alb:
    image: fidant-e2e-alb
    build: alb
    volumes:
      - ${FIDANT_E2E_COTURN_DIR:?}/turn.crt:/etc/alb/tls.crt:ro
      - ${FIDANT_E2E_COTURN_DIR:?}/turn.key:/etc/alb/tls.key:ro
    networks:
      public: { ipv4_address: 198.51.100.50 }
      lb: { ipv4_address: 10.89.3.2 }

  # The pages CDN stand-in: apps/infra/edge/site.js over the pages build, /relay-secret/* to alb.
  pages:
    image: fidant-e2e-node
    build:
      context: box
      target: node
    user: ${FIDANT_E2E_UID:?}:${FIDANT_E2E_GID:?}
    init: true
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    working_dir: ${FIDANT_E2E_REPO:?}
    command: ["node", "apps/e2e/networks/pages/serve.ts"]
    volumes:
      - ${FIDANT_E2E_REPO:?}:${FIDANT_E2E_REPO:?}:ro
      - ${FIDANT_E2E_PAGES_DIR:?}:/pages:ro
      - ${FIDANT_E2E_COTURN_DIR:?}/turn.crt:/etc/pages/tls.crt:ro
      - ${FIDANT_E2E_COTURN_DIR:?}/turn.key:/etc/pages/tls.key:ro
    networks:
      public: { ipv4_address: 198.51.100.60 }
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('net').connect(443, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"
      interval: 1s
      retries: 30
