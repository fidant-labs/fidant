<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Split-key bench</title>
    <link rel="stylesheet" href="/src/bench/bench.css" />
  </head>
  <body data-state="idle">
    <h1>Split-key bench (SIG-7)</h1>
    <p>
      Synthetic, seeded data only. Keys stay in the worker. The JSON holds measurements and the
      browser environment, nothing else.
    </p>

    <section aria-labelledby="micro-heading">
      <h2 id="micro-heading">Stage microbenchmarks</h2>
      <form id="micro-form">
        <label>
          MiB per stage
          <input id="micro-mib" type="number" min="1" max="4096" step="1" value="256" required />
        </label>
        <fieldset>
          <legend>AES-GCM chunk sizes</legend>
          <div id="micro-chunks"></div>
        </fieldset>
        <button id="micro-run" type="submit">Run microbenchmarks</button>
      </form>
    </section>

    <p id="status" role="status" aria-live="polite">Idle.</p>

    <section aria-labelledby="results-heading">
      <h2 id="results-heading">Results</h2>
      <table>
        <thead>
          <tr>
            <th scope="col">Stage</th>
            <th scope="col">Chunk</th>
            <th scope="col">MiB</th>
            <th scope="col">ms</th>
            <th scope="col">MB/s</th>
          </tr>
        </thead>
        <tbody id="results"></tbody>
      </table>
    </section>

    <section aria-labelledby="env-heading">
      <h2 id="env-heading">Environment</h2>
      <pre id="environment"></pre>
    </section>

    <section aria-labelledby="json-heading">
      <h2 id="json-heading">JSON</h2>
      <button id="copy" type="button">Copy JSON</button>
      <pre id="json"></pre>
    </section>

    <script type="module" src="/src/bench/main.ts"></script>
  </body>
</html>
